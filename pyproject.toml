[project]
name = "vigil"
version = "0.1.0"
description = "A human-gated aviation safety signal triage pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk>=1.0.0",
  "google-cloud-firestore>=2.20.0",
  "google-genai>=2.0.0",
  "hdbscan>=0.8.40",
  "huggingface-hub>=0.30.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "pyyaml>=6.0.0",
  "scikit-learn>=1.6.0",
  "streamlit>=1.44.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agents", "data", "eval", "pipeline", "ui"]

[tool.setuptools]
packages = ["agents", "data", "eval", "pipeline", "ui"]
