          <div><span class="acn">ACN 1461959</span>While on dogleg to final for a visual approach to 24R; I noticed a drone at about 200 feet distance on the right side of the aircraft.</div>
          <div><span class="acn">ACN 1748192</span>On final approach; approximately 4 miles from touchdown at approximately 1200 ft AGL; I spotted what initially appeared to be a large bird.</div>
          <div><span class="acn">ACN 1130209</span>On my third solo flight; I crossed the threshold at 70 KTS. I landed slightly flat and fast. Upon landing rollout the aircraft swerved.</div>
          <div><span class="acn">ACN 1799467</span>While flying a routine weekly route I came across a very small unmanned drone. I flew past him at very close proximity.</div>
          <div><span class="acn">ACN 1490553</span>I was flying with my instructor; about to turn towards the airport and land; when a Beechcraft passed us with less than 100 feet of clearance.</div>
          <div><span class="acn">ACN 1026406</span>Runway excursion due to temporary loss of control. Shortly after landing; directional control was lost resulting in a runway excursion.</div>
          <div><span class="acn">ACN 1419324</span>I was working Local South and I had Aircraft X doing stop and goes. Aircraft X was just about ready to touch down when I saw Aircraft Y.</div>
          <div><span class="acn">ACN 1640441</span>While flying a scenic flight with 2 passengers on board at 550 MSL over terrain surveyed at 15' MSL; putting our ship at approximately 535 AGL.</div>
          <div><span class="acn">ACN 1470131</span>We were about 10 mile NE of ANE under the Mode C for MSP and on the CTAF for 25D monitoring for parachute activity in the area.</div>
          <div><span class="acn">ACN 1111863</span>On VFR flight plan with student to GBN. On western heading at altitude of 4;500. Approach informed us of possible traffic conflict.</div>
          <div><span class="acn">ACN 1712248</span>While taxiing into parking; I was taxied over the elevator tie down rope and the engine sucked the tie down rope through the spinner.</div>
          <div><span class="acn">ACN 1295187</span>Just after approximately mid field downwind; after completing the landing checklist I looked out of the left hand side of the aircraft.</div>
          <div><span class="acn">ACN 1044401</span>Leaving MJD; I departed parallel Runway 18 and stayed out of and to the west of R-4403. I was flying at approximately 750 FT.</div>
          <div><span class="acn">ACN 1699435</span>The event filed took place after myself and two friends took up my friend's plane to pick up a part from FBO X.</div>
          <div><span class="acn">ACN 1461959</span>The drone appeared to be a quadcopter; black and about two feet in diameter. No evasive action was possible at that range.</div>
          <div><span class="acn">ACN 1748192</span>I was unable to determine whether the object was rotorcraft or unmanned until it had already passed below the glide path.</div>
          <div><span class="acn">ACN 1130209</span>I overcorrected to the right and departed the runway surface onto the grass. No injuries; aircraft was undamaged.</div>
